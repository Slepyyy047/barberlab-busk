name: Complete BARBERLAB media upload

on:
  push:
    branches: [main]
    paths:
      - '.upload-parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify supplied PNG assets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path('.upload-parts')
          items = json.loads((root / 'manifest.json').read_text(encoding='utf-8-sig'))
          for item in items:
              encoded = ''.join((root / part).read_text(encoding='ascii') for part in item['parts'])
              data = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if len(data) != item['bytes'] or digest != item['sha']:
                  raise ValueError(f"Asset verification failed: {item['path']}")
              target = Path(item['path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"Verified {target} ({len(data)} bytes)")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .upload-parts
          git add public
          git commit -m 'Assemble and verify BARBERLAB image assets'
          git push origin HEAD:main
